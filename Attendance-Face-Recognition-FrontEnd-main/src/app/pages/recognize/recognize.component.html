<h2>Recognize</h2>

<div class="form-container">
  <div class="mode-selector">
    <label>Attendance Mode</label>
    <div class="radio-group">
      <label class="radio-card">
        <input type="radio" name="mode" value="checkin" [(ngModel)]="mode">
        <div class="radio-content">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 17L15 12L10 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Check In</span>
        </div>
      </label>
      <label class="radio-card">
        <input type="radio" name="mode" value="checkout" [(ngModel)]="mode">
        <div class="radio-content">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Check Out</span>
        </div>
      </label>
    </div>
  </div>

  <div class="input-mode-toggle">
    <button 
      type="button"
      class="mode-toggle-btn" 
      [class.active]="inputMode === 'webcam'"
      (click)="switchInputMode('webcam')"
    >
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V8C3 7.46957 3.21071 6.96086 3.58579 6.58579C3.96086 6.21071 4.46957 6 5 6H9L11 3H17L19 6H23C23.5304 6 24.0391 6.21071 24.4142 6.58579C24.7893 6.96086 25 7.46957 25 8V19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 17C14.2091 17 16 15.2091 16 13C16 10.7909 14.2091 9 12 9C9.79086 9 8 10.7909 8 13C8 15.2091 9.79086 17 12 17Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Webcam
    </button>
    <button 
      type="button"
      class="mode-toggle-btn" 
      [class.active]="inputMode === 'upload'"
      (click)="switchInputMode('upload')"
    >
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17 8L12 3L7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Upload
    </button>
  </div>

  <div class="webcam-section" *ngIf="inputMode === 'webcam'">
    <app-webcam-capture (captured)="onCaptured($event)"></app-webcam-capture>
  </div>

  <div class="upload-section" *ngIf="inputMode === 'upload'">
    <div class="image-preview" [class.has-image]="uploadedImage">
      <img *ngIf="uploadedImageUrl" [src]="uploadedImageUrl" alt="Preview">
      <div *ngIf="!uploadedImageUrl" class="preview-placeholder">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V8C3 7.46957 3.21071 6.96086 3.58579 6.58579C3.96086 6.21071 4.46957 6 5 6H9L11 3H17L19 6H23C23.5304 6 24.0391 6.21071 24.4142 6.58579C24.7893 6.96086 25 7.46957 25 8V19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 17C14.2091 17 16 15.2091 16 13C16 10.7909 14.2091 9 12 9C9.79086 9 8 10.7909 8 13C8 15.2091 9.79086 17 12 17Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>No image selected</p>
      </div>
    </div>
    <input type="file" id="recognizeImageInput" accept="image/*" (change)="onFileSelected($event)" hidden>
    <button type="button" class="btn btn-secondary" (click)="triggerFileInput()">
      Choose Image
    </button>
  </div>

  <button 
    class="recognize-btn"
    (click)="recognize()" 
    [disabled]="!canSubmit()"
  >
    <span *ngIf="loading" class="loading"></span>
    {{ loading ? 'Recognizing...' : 'Recognize' }}
  </button>

  <div *ngIf="errorMsg" class="error-message">
    {{ errorMsg }}
  </div>

  <div *ngIf="result" class="result-container">
    <div class="result-header" [class.success]="result.recognized" [class.failure]="!result.recognized">
      {{ result.recognized ? 'Recognized' : 'Not Recognized' }}
    </div>
    
    <div *ngIf="result.recognized" class="result-details">
      <p>
        <strong>Employee ID:</strong>
        <span>{{ result.employee_id }}</span>
      </p>
      <p>
        <strong>Name:</strong>
        <span>{{ result.employee_name }}</span>
      </p>
      <p *ngIf="result.similarity !== undefined" class="similarity-row">
        <strong>Similarity:</strong>
        <span class="similarity-badge">{{ result.similarity | number:'1.0-3' }}</span>
      </p>
    </div>
  </div>
</div>
