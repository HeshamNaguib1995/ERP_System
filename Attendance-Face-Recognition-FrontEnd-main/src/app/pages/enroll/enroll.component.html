<h2>Enroll Employee</h2>

<div class="form-container">
  <form (ngSubmit)="submit()">
    <div class="form-group">
      <label for="employee_id">Employee ID</label>
      <input 
        id="employee_id"
        name="employee_id" 
        type="text"
        class="input"
        [(ngModel)]="employee_id" 
        required 
        placeholder="Enter employee ID"
      />
    </div>

    <div class="form-group">
      <label for="employee_name">Employee Name</label>
      <input 
        id="employee_name"
        name="employee_name" 
        type="text"
        class="input"
        [(ngModel)]="employee_name" 
        required 
        placeholder="Enter employee name"
      />
    </div>

    <div class="input-mode-toggle">
      <button 
        type="button"
        class="mode-toggle-btn" 
        [class.active]="inputMode === 'webcam'"
        (click)="switchInputMode('webcam')"
      >
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V8C3 7.46957 3.21071 6.96086 3.58579 6.58579C3.96086 6.21071 4.46957 6 5 6H9L11 3H17L19 6H23C23.5304 6 24.0391 6.21071 24.4142 6.58579C24.7893 6.96086 25 7.46957 25 8V19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 17C14.2091 17 16 15.2091 16 13C16 10.7909 14.2091 9 12 9C9.79086 9 8 10.7909 8 13C8 15.2091 9.79086 17 12 17Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Webcam
      </button>
      <button 
        type="button"
        class="mode-toggle-btn" 
        [class.active]="inputMode === 'upload'"
        (click)="switchInputMode('upload')"
      >
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 8L12 3L7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Upload
      </button>
    </div>

    <!-- Webcam Section -->
    <div class="webcam-section" *ngIf="inputMode === 'webcam'">
      <app-webcam-capture (captured)="onCaptured($event)"></app-webcam-capture>
      <div class="enrollment-progress">
        <p [class.complete]="captured.length === 5">{{ getProgressText() }}</p>
        <div class="progress-dots">
          <span *ngFor="let i of [0,1,2,3,4]" class="dot" [class.completed]="i < captured.length"></span>
        </div>
      </div>
      <div class="captured-images-preview" *ngIf="captured.length > 0">
        <div *ngFor="let img of capturedImageUrls; let i = index" class="captured-preview-item">
          <img [src]="img" [alt]="'Photo ' + (i + 1)">
          <span class="preview-label">{{ i + 1 }}/5</span>
        </div>
      </div>
      <div class="webcam-controls">
        <button type="button" class="clear-btn" (click)="clearImages()" *ngIf="captured.length > 0">
          Reset All
        </button>
      </div>
    </div>

    <!-- Upload Section -->
    <div class="upload-section" *ngIf="inputMode === 'upload'">
      <div class="images-grid">
        <div 
          *ngFor="let i of [0,1,2,3,4]; let idx = index" 
          class="image-upload-card"
          [class.has-image]="uploadedImages[idx]"
          (click)="triggerFileInput(idx)"
        >
          <img *ngIf="uploadedImageUrls[idx]" [src]="uploadedImageUrls[idx]" [alt]="'Image ' + (idx + 1)">
          <div *ngIf="!uploadedImageUrls[idx]" class="upload-placeholder">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Image {{ idx + 1 }}</span>
          </div>
          <input 
            type="file" 
            [id]="'uploadInput' + idx"
            accept="image/*" 
            (change)="onFileSelected($event, idx)"
            hidden
          >
        </div>
      </div>
    </div>

    <button 
      type="submit" 
      class="submit-btn"
      [disabled]="!canSubmit()"
    >
      <span *ngIf="submitting" class="loading"></span>
      {{ submitting ? 'Submitting...' : 'Submit Enrollment' }}
    </button>
  </form>

  <p *ngIf="message" class="message" [class.success]="message.includes('successfully')" [class.error]="!message.includes('successfully')">
    {{ message }}
  </p>
</div>
