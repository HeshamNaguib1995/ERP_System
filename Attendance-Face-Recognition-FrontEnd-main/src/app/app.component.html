<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/>
      </svg>
      <strong>Attendance System</strong>
    </div>
    <div class="nav-links">
      <a routerLink="/recognize" routerLinkActive="active">Recognize</a>
      <a routerLink="/enroll" routerLinkActive="active">Enroll</a>
      <a routerLink="/employees" routerLinkActive="active">Employees</a>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="(isDarkMode$ | async) ? 'Switch to light mode' : 'Switch to dark mode'">
        <svg *ngIf="!(isDarkMode$ | async)" class="theme-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg *ngIf="isDarkMode$ | async" class="theme-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="status-indicator" [class.online]="apiStatus === 'online'" [class.offline]="apiStatus === 'offline'">
        <span class="status-dot"></span>
        <span class="status-text">{{ apiStatus === 'online' ? 'Online' : apiStatus === 'offline' ? 'Offline' : 'Checking...' }}</span>
      </div>
    </div>
  </div>
</nav>

<main class="main-content">
  <router-outlet />
</main>
